worker_processes auto;
events { worker_connections 1024; }
include /etc/nginx/syslog-main.conf;
error_log /dev/stderr;

http {
  include           mime.types;
  default_type      application/octet-stream;
  sendfile          on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 10G;
  include /etc/nginx/real-ip.conf;
  real_ip_recursive off;

  log_format https  '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '"$http_host" "$scheme" '
                    'h3="$http3" ssl="$ssl_protocol" ssl_ci="$ssl_cipher" '
                    'rt="$request_time" uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    'realip_from="$realip_remote_addr" '
                    'cfip="$http_cf_connecting_ip" '
                    'xff="$http_x_forwarded_for" '
                    'cf_ray="$http_cf_ray"';
  include /etc/nginx/syslog-http.conf;
  access_log /dev/stdout https;

  map $http_accept_language $wc_lang {
    ~zh-tw zh-tw;
    ~zh zh-tw;
    ~en en;
    default zh-tw;
  }

  map $http_user_agent $wc_index_variant {
    default normal;
    ~*(googlebot|bingbot|slurp|duckduckbot|baiduspider|yandexbot|facebookexternalhit|twitterbot|linkedinbot|applebot|semrushbot|ahrefsbot|mj12bot|dotbot|crawler|spider|bot) bot;
  }

  map "$wc_index_variant:$uri:$wc_lang" $wc_locale_strip_target {
    default "";
    ~^normal:/(en|zh-tw):\1$ /;
    ~^normal:/(en|zh-tw)(/.*):\1$ $2;
  }

  map $request_uri $wc_404_lang {
    default $wc_lang;
    ~^/(en|zh-tw)(/|\?|$) $1;
  }

  map $uri $wc_redirect_target {
    default "";
    include /usr/share/nginx/html/.nginx-redirects*.map;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    error_page 404 /404/;
    location = /404/ {
      # Serve generated 404 page in selected variant (fallback to normal)
      try_files /$wc_404_lang/404/index.$wc_index_variant.html /$wc_404_lang/404/index.normal.html /zh-tw/404/index.$wc_index_variant.html /zh-tw/404/index.normal.html =404;
      add_header Vary "Accept-Language, User-Agent";
    }

    if ($wc_redirect_target != "") {
      return 301 $wc_redirect_target$is_args$args;
    }

    location = /.nginx-redirects.map {
      return 404;
    }

    location = / {
      try_files /$wc_lang/index.$wc_index_variant.html /$wc_lang/index.normal.html =404;
      add_header Vary "Accept-Language, User-Agent";
    }

    # Reject malformed paths with repeated slashes
    #if ($request_uri ~ "//+") {
    #  return 404;
    #}

    # Optional prefix removal when header locale equals prefix
    location ~ ^/(en|zh-tw)(/.*)?$ {
      if ($wc_locale_strip_target != "") {
        # if locale matches, strip prefix to non-prefixed URL, preserving host/port
        return 302 $scheme://$http_host$wc_locale_strip_target;
      }
      try_files $uri $uri/index.$wc_index_variant.html $uri/index.normal.html =404;
      add_header Vary "Accept-Language, User-Agent";
    }

    # Non-prefix: negotiate by Accept-Language, fall back to default
    location / {
      # First, serve direct file matches (assets/non-prefixed outputs),
      # then resolve route folders by selected variant.
      try_files $uri /$wc_lang$uri /$wc_lang$uri/index.$wc_index_variant.html /$wc_lang$uri/index.normal.html =404;
      add_header Vary "Accept-Language, User-Agent";
    }
  }
}
