brandName: WalksCloud 行雲資訊
companyNameEn: Walks Cloud Inc.
companyNameZh: 行雲資訊有限公司
baseUrl: https://walks.cloud
canonicalHost: walks.cloud
defaultLocale: zh-tw
locales:
  - zh-tw
  - en
localeFallbacks:
  zh:
    - zh-tw
    - en
  en: []
# Client-side recovery when an already-open tab navigates during a static rebuild.
clientNavigationRecovery:
  # Maximum time to wait for the target route HTML to become available.
  targetTimeoutMs: 10000
  # Poll interval while the target route is temporarily unavailable.
  retryIntervalMs: 1000
  # Time to show a passive notice before background retry resumes automatically.
  backgroundNoticeDurationMs: 5000
  # Browser service worker used for same-origin page and asset cache fallback.
  serviceWorkerPath: /wc-sw.js
  # Runtime cache namespace used by the browser service worker and direct page cache priming.
  runtimeCachePrefix: walkscloud-runtime-
  # Internal cache key for the last rendered HTML document fallback.
  runtimeDocumentFallbackPath: /__wc-runtime-document-fallback__
  # Build-generated list of same-origin pages and assets to precache for each released version.
  precacheManifestPath: /wc-precache-manifest.json
  # Required generated paths that must be present in the precache manifest and runtime cache reports.
  cacheInspectionPatterns:
    - /assets/app-pages-markdownpage-
    - /assets/MarkdownPage-
  # Maximum time to wait for console-triggered cache commands such as forceCache().
  cacheCommandTimeoutMs: 120000
  # Maximum time to wait while checking whether the target page is from a newer build.
  versionCheckTimeoutMs: 3000
  # Minimum time to show the newer-version notice before navigating to the target.
  versionNoticeMinMs: 2000
  # Maximum time to show the newer-version notice before navigating to the target.
  versionNoticeMaxMs: 5000
robots:
  policy: index,follow
socialImage: /og_image.webp
social:
  fbAppId: "2122887114805377"
  fbPages: "106051241536627"
og:
  imageType: image/webp
  imageWidth: 420
  imageHeight: 420
  siteName: "Walks Cloud Inc. 行雲資訊有限公司"
  localeMap:
    zh-tw: zh_TW
    en: en_US
org:
  url: https://walks.cloud
  logo: /logo-gradual.svg
  sameAs:
    - https://www.facebook.com/WalksCloud
    - https://www.linkedin.com/company/walkscloud/
  contactPoint:
    - telephone: ""
      contactType: customer support
